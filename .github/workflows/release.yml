name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Reject tracked credentials and generated output
        run: bash scripts/verify-repository-hygiene.sh

      - name: Scan fetched branch and tag history for secrets
        run: bash scripts/scan-secrets.sh

      - name: Mutation-test security gates
        run: bash scripts/test-security-gates.sh

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --maxWorkers=1 --no-file-parallelism

      - name: Architecture lint
        run: npm run lint:architecture

      - name: Architecture tests
        run: npm run test:architecture

      - name: Docs and Agent Skill surface check
        run: npm run verify:docs-surface

      - name: Dead code check
        run: npm run validate:dead-code

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ivannovak'

      - name: Reject tracked credentials and generated output
        run: bash scripts/verify-repository-hygiene.sh

      - name: Rescan fetched branch and tag history before running write-capable release code
        run: bash scripts/scan-secrets.sh

      - name: Install dependencies
        run: npm ci

      - name: Capture pre-release version
        id: prerelease
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture post-release version
        id: postrelease
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package release tarball
        if: steps.postrelease.outputs.version != steps.prerelease.outputs.version
        env:
          RELEASE_VERSION: ${{ steps.postrelease.outputs.version }}
        run: |
          ARCHIVE_ROOT="lux-v${RELEASE_VERSION}-linux-x64"

          mkdir -p "${ARCHIVE_ROOT}/bin"
          cp -r dist "${ARCHIVE_ROOT}/"
          cp package.json package-lock.json "${ARCHIVE_ROOT}/"
          cp bin/lux "${ARCHIVE_ROOT}/bin/"
          chmod +x "${ARCHIVE_ROOT}/bin/lux"

          tar -czf "${ARCHIVE_ROOT}.tar.gz" -C "${ARCHIVE_ROOT}" .

          rm -rf "${ARCHIVE_ROOT}"

      - name: Upload tarball to GitHub release
        if: steps.postrelease.outputs.version != steps.prerelease.outputs.version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.postrelease.outputs.version }}
        run: gh release upload "v${RELEASE_VERSION}" "lux-v${RELEASE_VERSION}-linux-x64.tar.gz" --clobber
